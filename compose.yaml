services:
  dblp:
    build: .
    ports:
      - "${DBLP_PORT:-8080}:8080"
    environment:
      DBLP_TIMEZONE: ${DBLP_TIMEZONE:-Europe/Berlin}
      DBLP_URL: ${DBLP_URL:-https://drops.dagstuhl.de/storage/artifacts/dblp/xml/{year}/dblp-{date}.xml.gz}
    volumes:
      - dblp-data:/data
    restart: unless-stopped

volumes:
  dblp-data:
