<style>
  :root{font:16px/1.5 system-ui,sans-serif;color:#17232b;background:#f5f7f8}
  *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}
  main{width:min(100% - 2rem,1480px);margin:1.5rem auto}form{background:white;border:1px solid #d8e1e6;border-radius:9px;padding:1rem;box-shadow:0 2px 8px #173b500b}
  .grid{display:grid;grid-template-columns:2fr 1.3fr;gap:.8rem}.field{position:relative}label{display:block;font-size:.82rem;font-weight:650;margin-bottom:.25rem}input,select,button{font:inherit}input,select{width:100%;border:1px solid #a8bbc5;border-radius:5px;padding:.55rem;background:white}input:focus,select:focus{outline:2px solid #2d789d;outline-offset:1px}button{border:0;border-radius:5px;background:#146b92;color:white;padding:.57rem 1rem;cursor:pointer}button:hover{background:#0e5474}button:disabled{opacity:.5;cursor:default}.actions{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.type-filters{display:flex;align-items:center;justify-content:flex-end;gap:.28rem;flex-wrap:wrap;margin-left:auto}.type-pill{padding:.32rem .55rem;border:1px solid #b9c8ce;border-radius:999px;background:#edf1f3;color:#40515a;font-size:.78rem;line-height:1.2}.type-pill[aria-pressed="false"]{background:white!important;color:#65737a!important;border-color:#c5cdd1!important;opacity:.65}.type-pill[aria-pressed="true"]{box-shadow:inset 0 0 0 1px currentColor}.muted{color:#536771;font-size:.9rem}.suggestions{position:absolute;top:100%;left:0;right:0;z-index:2;background:white;border:1px solid #a8bbc5;border-radius:5px;box-shadow:0 8px 20px #173b5026;max-height:17rem;overflow:auto}.suggestions:empty{display:none}.suggestions button{display:block;width:100%;text-align:left;border-radius:0;background:white;color:#17232b;border-bottom:1px solid #edf0f2}.suggestions button:hover,.suggestions button[aria-selected="true"]{background:#d7edf6}
  #results,#similar,#cart-cards{display:flex;flex-direction:column;gap:.35rem}#results{margin-top:1.5rem}.result-row{display:flex;align-items:center;gap:.55rem;min-width:0;min-height:2.7rem;padding:.4rem .7rem;background:#fff;border:1px solid #d8e1e6;border-radius:6px;cursor:pointer;transition:background .15s,border-color .15s}.result-row:hover,.result-row:focus-visible{background:#f0f7fa}.result-row.in-cart{background:#eaf6ee;border-color:#a8d2b5}.result-row.in-cart:hover{background:#e0f1e6}.row-title,.row-authors{flex:0 1 auto;min-width:0;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-title{font-weight:700}.row-authors{color:#4a5d66;font-size:.91rem}.venue-pills{display:flex;align-items:center;gap:.3rem;flex:0 0 auto;max-width:45%;min-width:0;margin-left:auto;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}.venue-pill{flex:none;border:1px solid #bad5e2;border-radius:999px;background:#edf5f9;color:#185b79;padding:.16rem .55rem;font-size:.78rem;line-height:1.3}.venue-pill:hover{background:#d7eaf3}.venue-pill.in-cart{border-color:#81bd94;background:#d7eddf;color:#285f39}.empty{background:#fff;border:1px solid #d8e1e6;border-radius:7px;padding:1rem}#more{margin:1rem 0 3rem}#similar{margin-top:1.5rem}#similar h2{font-size:1.1rem;margin:0}
  .result-row{display:grid;grid-template-columns:minmax(0,1fr) fit-content(55%);grid-template-rows:auto auto;align-items:center;column-gap:.55rem;row-gap:.16rem;padding:.48rem .7rem}.row-top{display:contents}.row-top .row-authors{grid-column:1;grid-row:1;max-width:none}.row-top .venue-pills{grid-column:2;grid-row:1/span 2;max-width:100%;margin-left:auto}.venue-pill{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;min-height:2.1rem;padding:.16rem .55rem}.venue-year{font-size:.72em;line-height:1.1;opacity:.85}.result-row .row-title{display:block;grid-column:1;grid-row:2;max-width:100%;font-size:1rem}.cart-row{grid-template-columns:minmax(0,1fr) fit-content(55%) auto}.cart-row .remove-card{grid-column:3;grid-row:1/span 2;margin-left:0}
  .venue-pill.kind-journal,.venue-pill.kind-journal.in-cart,.type-pill.kind-journal[aria-pressed="true"]{background:#d9c4ed;border-color:#ad89cc;color:#50316e}.venue-pill.kind-journal:hover{background:#ccb0e5}.venue-pill.kind-conference,.venue-pill.kind-conference.in-cart,.type-pill.kind-conference[aria-pressed="true"]{background:#b9d7f4;border-color:#7faedb;color:#244f79}.venue-pill.kind-conference:hover{background:#a6caed}.venue-pill.kind-monograph,.venue-pill.kind-monograph.in-cart,.type-pill.kind-monograph[aria-pressed="true"]{background:#f7e9a6;border-color:#d8bf64;color:#67510e}.venue-pill.kind-monograph:hover{background:#f1df88}.venue-pill.kind-artifact,.venue-pill.kind-artifact.in-cart,.type-pill.kind-artifact[aria-pressed="true"]{background:#cda985;border-color:#a77e58;color:#52351e}.venue-pill.kind-artifact:hover{background:#be9974}.venue-pill.kind-preprint,.venue-pill.kind-preprint.in-cart,.type-pill.kind-preprint[aria-pressed="true"]{background:#e0e3e6;border-color:#b8c0c6;color:#3e4a51}.venue-pill.kind-preprint:hover{background:#d1d6da}.venue-pill.kind-other,.venue-pill.kind-other.in-cart,.type-pill.kind-other[aria-pressed="true"]{background:#edf0f1;border-color:#c5cbce;color:#47565d}.venue-pill.kind-other:hover{background:#e0e5e7}.venue-pill.in-cart{box-shadow:inset 0 0 0 2px #39794d}
  .venue-choice{display:inline-flex;align-items:center;gap:.12rem;flex:none}.pill-cart-icon{font-size:.7rem;line-height:1;color:#39794d}.cart-disabled .pill-cart-icon{display:none}.cart-disabled .result-row.in-cart{background:#fff;border-color:#d8e1e6}.cart-disabled .result-row.in-cart:hover{background:#f0f7fa}.cart-disabled .venue-pill.in-cart{box-shadow:none}.cart-panel.cart-disabled{background:#f0f3f1;border-color:#d8e1dc}.cart-panel.cart-disabled .cart-controls:not(:first-child){opacity:.55}#toggle-cart-mode{font-size:.78rem;min-width:3.2rem;padding:.24rem .5rem}#toggle-cart-mode[aria-checked="false"]{background:#e5e9e7;border-color:#bec9c2;color:#4c6254}
  .top-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(18rem,1fr);gap:1rem;align-items:stretch}.top-row.cart-only{grid-template-columns:minmax(0,1fr)}.cart-panel{height:100%;display:flex;flex-direction:column;justify-content:center;gap:.35rem;padding:1rem;background:#e5f3e9;border:1px solid #a8d2b5;border-radius:9px;box-shadow:0 2px 8px #173b500b}.cart-controls{display:flex;align-items:center;gap:.4rem;white-space:nowrap;overflow-x:auto}.cart-controls h2{flex:none;margin:0 .3rem 0 0;font-size:1.05rem}.cart-controls button{flex:none;padding:.35rem .6rem;background:#c9e8d3;border:1px solid #a8d2b5;color:#235b34}.cart-controls button:hover{background:#b8dec4}#show-cart[aria-pressed="true"],#show-cart[aria-pressed="true"]:hover{background:#69b983;border-color:#39794d;color:#123f25;box-shadow:inset 0 0 0 1px #39794d}.cart-panel input[type=radio]{width:auto;margin:0}.checkout-modes{display:flex;align-items:center;gap:.5rem;flex:none}.checkout-modes label{display:flex;align-items:center;gap:.2rem;margin:0;font-size:.82rem;font-weight:500}.cart-feedback{color:#315b3d;font-size:.86rem}.cart-feedback:empty{display:none}.download{display:inline-block;font-weight:650;color:#095e86}#cart-results{margin-top:1rem}#cart-results h2{font-size:1.1rem;margin:0 0 .6rem}.remove-card{flex:none;margin-left:auto;background:#c9e8d3;border:1px solid #a8d2b5;color:#235b34;padding:.35rem .6rem;font-size:.82rem}.remove-card:hover{background:#b8dec4}#load-sentinel{height:1px}
  @media(max-width:1100px){.top-row{grid-template-columns:1fr}}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.result-row{gap:.4rem}}@media(max-width:500px){.grid{grid-template-columns:1fr}.row-authors{font-size:.8rem}.venue-pill{font-size:.72rem}.result-row{padding:.35rem .4rem}}
</style>
<main>
  <div class="top-row">
  <form id="form" autocomplete="off">
    <div class="grid">
      <div class="field"><label for="q">Title, topic, or keyword</label><input id="q" name="q" placeholder="e.g. graph neural networks"><div class="suggestions" id="title-suggestions"></div></div>
      <div class="field"><label for="author">Author</label><input id="author" name="author" placeholder="Start typing an author name"><div class="suggestions" id="author-suggestions"></div></div>
    </div>
    <div class="actions"><button type="submit">Search</button><div class="type-filters" role="group" aria-label="Publication types"><button type="button" class="type-pill kind-journal" data-category="journal" aria-pressed="true">Journal</button><button type="button" class="type-pill kind-conference" data-category="conference" aria-pressed="true">Conference</button><button type="button" class="type-pill kind-monograph" data-category="monograph" aria-pressed="true">Monographs</button><button type="button" class="type-pill kind-artifact" data-category="artifact" aria-pressed="true">Artifacts</button><button type="button" class="type-pill kind-preprint" data-category="informal" aria-pressed="true">Informal</button><button type="button" class="type-pill kind-other" data-category="other" aria-pressed="true">Other</button></div></div>
  </form>
  <section class="cart-panel" aria-label="Citation cart">
    <div class="cart-controls"><h2>Citation cart</h2><button id="toggle-cart-mode" type="button" role="switch" aria-label="Enable citation cart" aria-checked="true">On</button><button id="show-cart" type="button" disabled>Show (0)</button><button id="reset-cart" type="button" disabled>Reset</button></div>
    <div class="cart-controls"><button id="checkout" type="button" disabled>Checkout</button><div class="checkout-modes" role="radiogroup" aria-label="Checkout format"><label><input type="radio" name="checkout-mode" value="clipboard" checked>Clipboard</label><label><input type="radio" name="checkout-mode" value="download">Download</label></div></div>
    <div id="cart-feedback" class="cart-feedback" role="status" aria-live="polite"></div>
    <a id="download-bib" class="download" hidden>Download .bib</a>
  </section>
  </div>
  <section id="cart-results" hidden><h2>Citation cart</h2><div id="cart-cards"></div></section>
  <div id="index-status" class="muted" aria-live="polite"></div>
  <section id="results" aria-live="polite"></section>
  <div id="load-sentinel" aria-hidden="true"></div>
  <button id="more" type="button" hidden>Continue loading results</button>
  <section id="similar"></section>
</main>
<script>
const MANUAL_OVERRIDES=__MANUAL_OVERRIDES_JSON__;
const form=document.querySelector('#form'), results=document.querySelector('#results'), sentinel=document.querySelector('#load-sentinel'), more=document.querySelector('#more'), similar=document.querySelector('#similar');
let offset=0, requestId=0, loading=false, hasMore=false, seenTitles=new Set(),emptyPages=0,autoLoadPaused=false;
function el(tag,text,cls){const node=document.createElement(tag);if(text!=null)node.textContent=text;if(cls)node.className=cls;return node}
async function api(path,params){const url=new URL(path.replace(/^\/+/,''),location.href);url.search=new URLSearchParams(params).toString();const response=await fetch(url);const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
async function postApi(path,data){const url=new URL(path.replace(/^\/+/,''),location.href);const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw Error(result.error||'Request failed');return result}
async function copyText(value){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(value);return true}catch(_){}}const field=el('textarea');field.value=value;field.style.position='fixed';field.style.left='-9999px';document.body.append(field);field.focus();field.select();let copied=false;try{copied=document.execCommand('copy')}catch(_){}field.remove();return copied}
const cartFeedback=document.querySelector('#cart-feedback'),cartResults=document.querySelector('#cart-results'),cartCards=document.querySelector('#cart-cards'),showCartButton=document.querySelector('#show-cart'),checkoutButton=document.querySelector('#checkout'),resetCartButton=document.querySelector('#reset-cart'),downloadBib=document.querySelector('#download-bib'),cartModeButton=document.querySelector('#toggle-cart-mode'),cartPanel=document.querySelector('.cart-panel');
const CART_STORAGE='dblp-citation-cart',CART_MODE_STORAGE='dblp-citation-cart-enabled';let cart=[],downloadUrl=null,cartRequestId=0,cartEnabled=true;
try{const stored=JSON.parse(localStorage.getItem(CART_STORAGE)||'[]');if(Array.isArray(stored))cart=[...new Set(stored.filter(key=>typeof key==='string'&&key.length<=300))].slice(0,1000)}catch(_){}
try{cartEnabled=localStorage.getItem(CART_MODE_STORAGE)!=='false'}catch(_){}
function feedback(message){cartFeedback.textContent=message}
function renderCart(){showCartButton.textContent=`${cartResults.hidden?'Show':'Hide'} (${cart.length})`;showCartButton.setAttribute('aria-pressed',String(!cartResults.hidden));showCartButton.disabled=!cartEnabled||!cart.length;checkoutButton.disabled=!cartEnabled||!cart.length;resetCartButton.disabled=!cartEnabled||!cart.length;for(const input of document.querySelectorAll('input[name="checkout-mode"]'))input.disabled=!cartEnabled;cartModeButton.textContent=cartEnabled?'On':'Off';cartModeButton.setAttribute('aria-checked',String(cartEnabled));cartPanel.classList.toggle('cart-disabled',!cartEnabled);document.querySelector('main').classList.toggle('cart-disabled',!cartEnabled);try{localStorage.setItem(CART_STORAGE,JSON.stringify(cart));localStorage.setItem(CART_MODE_STORAGE,String(cartEnabled))}catch(_){}updateRowHighlights();updateResultActions()}
function setCartView(show){cartResults.hidden=!show;form.hidden=show;results.hidden=show;similar.hidden=show;sentinel.hidden=show;more.hidden=show||!hasMore||!autoLoadPaused;document.querySelector('#index-status').hidden=show;document.querySelector('.top-row').classList.toggle('cart-only',show);renderCart();if(!show&&!autoLoadPaused)requestAnimationFrame(maybeLoadMore)}
function cartChanged(){downloadBib.hidden=true;if(!cart.length){if(!cartResults.hidden)setCartView(false);cartCards.replaceChildren()}renderCart();if(!cartResults.hidden)loadCartCards()}
function setCartEnabled(enabled){if(!enabled&&!cartResults.hidden){setCartView(false);cartRequestId++}cartEnabled=enabled;downloadBib.hidden=true;feedback(enabled?'Citation cart enabled. Click a row or venue pill to add a key.':'Citation cart off. Venue pills open publication links.');renderCart()}
function cleanAuthors(value){return String(value||'').split(/\s*,\s*/).map(name=>name.replace(/\s+\d{4}(?=\s*$)/,'').trim()).filter(Boolean)}
function authorDisplay(value){return cleanAuthors(value).join(' · ')||'Author unavailable'}
function displayTitle(value){return String(value||'').trim().replace(/\.+$/,'').trim()||'(untitled)'}
function fitAuthors(span){const names=span._authorNames;if(!span.isConnected||!names?.length)return;const width=span.clientWidth;if(!width)return;span.textContent=names.join(' · ');if(span.scrollWidth<=width+1||names.length===1)return;let low=0,high=names.length-1,best='';while(low<=high){const count=Math.floor((low+high)/2),remaining=names.length-count,candidate=(count?names.slice(0,count).join(' · ')+' · ':'')+`and ${remaining} more author${remaining===1?'':'s'}`;span.textContent=candidate;if(span.scrollWidth<=width+1){best=candidate;low=count+1}else high=count-1}span.textContent=best||`and ${names.length} more authors`}
function prepareAuthors(span,value){span._authorNames=cleanAuthors(value);span.title=span._authorNames.join(' · ');requestAnimationFrame(()=>fitAuthors(span))}
let authorResizeFrame;window.addEventListener('resize',()=>{cancelAnimationFrame(authorResizeFrame);authorResizeFrame=requestAnimationFrame(()=>{for(const span of document.querySelectorAll('.row-authors'))fitAuthors(span)})});
function updateRowHighlights(){const keys=new Set(cart);for(const row of document.querySelectorAll('.result-row[data-keys]')){row.classList.toggle('in-cart',JSON.parse(row.dataset.keys).some(key=>keys.has(key)));for(const pill of row.querySelectorAll('.venue-pill[data-key]'))pill.classList.toggle('in-cart',keys.has(pill.dataset.key))}}
function publicationLink(item){for(const value of [item.ee,item.url]){try{const url=new URL(value);if(url.protocol==='https:'||url.protocol==='http:')return url.href}catch(_){}}return 'https://dblp.org/rec/'+encodeURI(item.dblp_key)}
function activatePublication(item){if(cartEnabled)addToCart(item);else window.location.assign(publicationLink(item))}
function updateResultActions(){for(const row of document.querySelectorAll('.result-row[data-keys]'))updateResultActionsForRow(row)}
async function addToCart(item){const already=cart.includes(item.dblp_key),full=!already&&cart.length>=1000;if(!already&&!full){cart.push(item.dblp_key);cartChanged()}const copied=await copyText('DBLP:'+item.dblp_key);feedback(full?(copied?'Key copied; cart limit reached (1,000 keys).':'Cart limit reached (1,000 keys); clipboard access failed.'):copied?(already?'Key copied; already in citation cart.':'Key copied and added to citation cart.'):(already?'Already in citation cart; clipboard access failed.':'Added to citation cart; clipboard access failed.'))}
function venueLabel(version){const venue=version.venue||version.reference_type||version.record_type||'Venue unavailable';for(const [prefix,rule] of Object.entries(MANUAL_OVERRIDES.key_prefixes)){if(version.dblp_key?.startsWith(prefix)&&rule.label)return rule.label}return MANUAL_OVERRIDES.venues[venue]?.label||venue}
function pillKind(version){const kind=version.reference_type;return ['journal','conference','monograph','artifact','preprint'].includes(kind)?kind:'other'}
function venuePill(version,tag='button'){const label=venueLabel(version),pill=el(tag,null,'venue-pill kind-'+pillKind(version));pill.append(el('span',label));if(version.year!=null)pill.append(el('span',String(version.year),'venue-year'));return pill}
function card(group){
  const versions=group.versions?.length?group.versions:[group],preferred=versions[0],row=el('article',null,'result-row'),top=el('div',null,'row-top'),title=el('strong',displayTitle(group.title),'row-title'),authors=el('span',authorDisplay(group.authors||preferred.authors),'row-authors'),venues=el('span',null,'venue-pills');
  row.dataset.keys=JSON.stringify(versions.map(version=>version.dblp_key));row._title=displayTitle(group.title);row.tabIndex=0;row.setAttribute('role','button');title.title=displayTitle(group.title);prepareAuthors(authors,group.authors||preferred.authors);
  for(const version of versions){const pill=venuePill(version),choice=el('span',null,'venue-choice'),icon=el('span','🛒','pill-cart-icon');pill.type='button';pill.dataset.key=version.dblp_key;pill._version=version;icon.setAttribute('aria-hidden','true');choice.addEventListener('click',event=>{event.stopPropagation();activatePublication(version)});choice.append(pill,icon);venues.append(choice)}
  row.addEventListener('click',()=>activatePublication(preferred));row.addEventListener('keydown',event=>{if(event.target===row&&(event.key==='Enter'||event.key===' ')){event.preventDefault();activatePublication(preferred)}});top.append(authors,venues);row.append(top,title);row.classList.toggle('in-cart',versions.some(version=>cart.includes(version.dblp_key)));for(const pill of venues.querySelectorAll('.venue-pill'))pill.classList.toggle('in-cart',cart.includes(pill.dataset.key));updateResultActionsForRow(row);return row
}
function updateResultActionsForRow(row){const action=cartEnabled?'Add best reference for':'Open best publication for';row.setAttribute('aria-label',`${action} ${row._title}`);for(const pill of row.querySelectorAll('.venue-pill[data-key]')){const version=pill._version,label=venueLabel(version);pill.title=cartEnabled?`Add ${version.reference_type||version.record_type||'reference'}: ${label}${version.year?' · '+version.year:''} · DBLP:${version.dblp_key}`:`Open publication: ${label}${version.year?' · '+version.year:''}`;pill.setAttribute('aria-label',pill.title)}}
function cartCard(item){const row=el('article',null,'result-row cart-row'),top=el('div',null,'row-top'),title=el('strong',displayTitle(item.title),'row-title'),authors=el('span',authorDisplay(item.authors),'row-authors'),venues=el('span',null,'venue-pills'),pill=venuePill(item,'span'),button=el('button','Remove','remove-card');pill.classList.add('in-cart');title.title=displayTitle(item.title);prepareAuthors(authors,item.authors);pill.title=[venueLabel(item),item.year,'DBLP:'+item.dblp_key].filter(Boolean).join(' · ');venues.append(pill);row.style.cursor='default';button.type='button';button.setAttribute('aria-label','Remove '+displayTitle(item.title)+' from cart');button.addEventListener('click',()=>{cart=cart.filter(key=>key!==item.dblp_key);cartChanged();feedback('Publication removed from cart.')});top.append(authors,venues,button);row.append(top,title);return row}
async function loadCartCards(){const id=++cartRequestId,keys=[...cart];cartCards.replaceChildren(el('p','Loading cart…','muted'));try{const data=await postApi('/api/records',{keys});if(id!==cartRequestId||cartResults.hidden)return;cartCards.replaceChildren();for(const item of data.records)cartCards.append(cartCard(item));if(data.missing.length)feedback(`${data.missing.length} cart key(s) are absent from the current index.`)}catch(error){if(id===cartRequestId){cartCards.replaceChildren(el('div',error.message,'empty'))}}}
function toggleCart(){if(cartResults.hidden){setCartView(true);loadCartCards()}else{setCartView(false);cartRequestId++}}
async function checkout(){checkoutButton.disabled=true;downloadBib.hidden=true;try{const data=await postApi('/api/bibtex',{keys:cart});if(!data.entries.length){feedback('No current BibTeX entries were found for these keys.');return}const combined=data.entries.map(entry=>entry.bibtex).join('\n'),blob=new Blob([combined],{type:'application/x-bibtex;charset=utf-8'});if(downloadUrl)URL.revokeObjectURL(downloadUrl);downloadUrl=URL.createObjectURL(blob);downloadBib.href=downloadUrl;downloadBib.download='dblp-cart.bib';const missing=data.missing.length?` ${data.missing.length} key(s) were absent from the current index.`:'';const mode=document.querySelector('input[name="checkout-mode"]:checked').value;if(mode==='download'){downloadBib.hidden=false;downloadBib.click();feedback(`${data.entries.length} BibTeX entries prepared for download.`+missing)}else if(blob.size>1_000_000){downloadBib.hidden=false;feedback('BibTeX is too large for the clipboard. Download .bib instead.'+missing)}else if(await copyText(combined)){feedback(`${data.entries.length} BibTeX entries copied to clipboard.`+missing)}else{downloadBib.hidden=false;feedback('Clipboard access failed. Download .bib instead.'+missing)}}catch(error){feedback(error.message)}finally{checkoutButton.disabled=!cartEnabled||!cart.length}}
function resetCart(){if(!window.confirm(`Remove all ${cart.length} publication${cart.length===1?'':'s'} from the citation cart?`))return;cart=[];cartRequestId++;setCartView(false);cartCards.replaceChildren();cartChanged();feedback('Citation cart reset.')}
renderCart();cartModeButton.addEventListener('click',()=>setCartEnabled(!cartEnabled));showCartButton.addEventListener('click',toggleCart);checkoutButton.addEventListener('click',checkout);resetCartButton.addEventListener('click',resetCart);
const typeButtons=[...document.querySelectorAll('.type-pill[data-category]')];let displayedRows=[],typeCounts={};
for(const button of typeButtons){button.dataset.label=button.textContent;button.append(el('span',' (0)','type-count'))}
function updateTypeCounts(){const incomplete=Boolean(document.querySelector('#author').value.trim()&&hasMore);for(const button of typeButtons){const count=typeCounts[button.dataset.category]||0,suffix=incomplete?'+':'';button.querySelector('.type-count').textContent=` (${count}${suffix})`;button.title=`${count}${suffix} result group${count===1&&!incomplete?'':'s'} containing ${button.dataset.label.toLowerCase()}${incomplete?' (more author results remain)':''}`}}
function groupYear(group){return Math.max(-1,...(group.versions?.length?group.versions:[group]).map(version=>Number(version.year)||-1))}
function countGroupTypes(group){const kinds=new Set((group.versions?.length?group.versions:[group]).map(version=>version.reference_type==='preprint'?'informal':pillKind(version)));for(const kind of kinds)typeCounts[kind]=(typeCounts[kind]||0)+1}
function addSortedRow(group){const row=card(group),year=groupYear(group),index=displayedRows.findIndex(item=>item.year<year);results.insertBefore(row,index<0?null:displayedRows[index].row);displayedRows.splice(index<0?displayedRows.length:index,0,{row,year});countGroupTypes(group)}
function searchParams(append=false){const data=new FormData(form),params={};for(const [key,value] of data)if(String(value).trim())params[key]=String(value).trim();const selected=typeButtons.filter(button=>button.getAttribute('aria-pressed')==='true').map(button=>button.dataset.category);if(selected.length!==typeButtons.length)params.category=selected.join(',');params.limit=params.author&&!append?'300':'20';params.sort='year_desc';return params}
function maybeLoadMore(){if(cartResults.hidden&&!loading&&hasMore&&!autoLoadPaused&&sentinel.getBoundingClientRect().top<innerHeight+600)runSearch(true)}
async function runSearch(append=false){if(append&&(loading||!hasMore||!cartResults.hidden))return;const id=append?requestId:++requestId;if(!append){if(!cartResults.hidden)setCartView(false);offset=0;seenTitles=new Set();displayedRows=[];typeCounts={};hasMore=false;updateTypeCounts();emptyPages=0;autoLoadPaused=false;results.replaceChildren();similar.replaceChildren();more.hidden=true}const params=searchParams(append);params.offset=String(offset);if(!params.q&&!params.author&&!params.venue&&!params.category){results.append(el('div','Enter a title, topic, keyword, author, venue, or choose a publication type.','empty'));return}loading=true;const status=el('p','Searching…','muted');results.append(status);try{const data=await api('/api/search',params);if(id!==requestId)return;status.remove();let added=0;for(const item of data.results){const key=item.group_key||item.title?.toLocaleLowerCase()||item.dblp_key;if(seenTitles.has(key))continue;seenTitles.add(key);addSortedRow(item);added++}if(!append&&!added){results.append(el('div','No matches found.','empty'));if(params.q)showClosest(params.q,id)}const next=data.next_offset??offset+data.results.length;hasMore=Boolean(data.has_more)&&next>offset;offset=next;updateTypeCounts();emptyPages=added?0:emptyPages+1;if(emptyPages>=3&&hasMore){autoLoadPaused=true;more.hidden=false}}catch(error){if(id===requestId){status.remove();hasMore=false;updateTypeCounts();results.append(el('div',error.message,'empty'))}}finally{if(id===requestId){loading=false;if(hasMore&&!autoLoadPaused)requestAnimationFrame(maybeLoadMore)}}}
async function showClosest(q,id){try{const data=await api('/api/closest',{q,limit:5});if(id!==requestId||!data.results.length)return;similar.append(el('h2','Closest hits'));for(const item of data.results)similar.append(card(item))}catch(_){}}
function wireAutocomplete(inputId,kind){const input=document.getElementById(inputId),box=document.getElementById(kind+'-suggestions');let timer,seq=0,active=-1;input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-controls',box.id);box.setAttribute('role','listbox');function highlight(index){const options=[...box.children];active=index;options.forEach((option,i)=>option.setAttribute('aria-selected',String(i===active)));if(active>=0){input.setAttribute('aria-activedescendant',options[active].id);options[active].scrollIntoView({block:'nearest'})}else input.removeAttribute('aria-activedescendant')}function close(){box.replaceChildren();active=-1;input.removeAttribute('aria-activedescendant');input.setAttribute('aria-expanded','false')}function choose(option){clearTimeout(timer);seq++;input.value=option.dataset.value||option.textContent;close();runSearch()}input.addEventListener('input',()=>{clearTimeout(timer);close();const q=input.value.trim(),id=++seq;if(q.length<2)return;timer=setTimeout(async()=>{try{const data=await api('/api/autocomplete',{q,kind,limit:8});if(id!==seq)return;for(const [i,item] of data.suggestions.entries()){const label=kind==='author'?item.name:item.title;const display=kind==='author'?cleanAuthors(label).join(', '):displayTitle(label);const button=el('button',display);button.type='button';button.id=box.id+'-'+i;button.dataset.value=kind==='title'?displayTitle(label):label;button.setAttribute('role','option');button.setAttribute('aria-selected','false');button.addEventListener('click',()=>choose(button));box.append(button)}input.setAttribute('aria-expanded',String(box.children.length>0))}catch(_){}},220)});input.addEventListener('blur',()=>setTimeout(close,150));input.addEventListener('keydown',event=>{if(event.key==='Escape'){close();return}const options=[...box.children];if(!options.length)return;if(event.key==='ArrowDown'){event.preventDefault();highlight((active+1)%options.length)}else if(event.key==='ArrowUp'){event.preventDefault();highlight(active<=0?options.length-1:active-1)}else if(event.key==='Enter'&&active>=0){event.preventDefault();choose(options[active])}})}
wireAutocomplete('q','title');wireAutocomplete('author','author');form.addEventListener('submit',event=>{event.preventDefault();runSearch()});for(const button of typeButtons)button.addEventListener('click',()=>{const solo=button.getAttribute('aria-pressed')==='true'&&typeButtons.every(item=>item===button||item.getAttribute('aria-pressed')==='false');for(const item of typeButtons)item.setAttribute('aria-pressed',String(solo||item===button));runSearch()});more.addEventListener('click',()=>{autoLoadPaused=false;emptyPages=0;more.hidden=true;runSearch(true)});new IntersectionObserver(maybeLoadMore,{rootMargin:'600px'}).observe(sentinel);
async function checkIndex(){const status=document.querySelector('#index-status');try{const data=await api('/api/status',{});if(data.ready){status.textContent='';return}const phase=data.refresh.phase||'starting';status.textContent='Preparing the dblp index: '+phase+'. Search will be available when indexing finishes.'}catch(_){status.textContent='Waiting for the dblp service…'}setTimeout(checkIndex,15000)}checkIndex();
</script>
